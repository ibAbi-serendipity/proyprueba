
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Proyecto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="login-container">
        <form id="loginForm" class="login-form">
            <h1>Iniciar sesión</h1>

            <p>Bienvenido. Ingresa tus datos para continuar.</p>
            <p>Completa los siguientes campos para acceder al sistema.</p>

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                autocomplete="email"
                required
            >

            <label for="password">Contraseña</label>
            <div class="password-container">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >
                <button type="button" id="togglePassword">
                    Mostrar
                </button>
            </div>

            <button type="submit" id="loginButton">Ingresar</button>

            <p id="mensaje" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
